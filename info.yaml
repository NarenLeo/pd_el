
# Tiny Tapeout project information
project:
  title: "ReCORDIC: Reconfigurable CORDIC Accelerator"
  author: "Navya Singh"
  discord: ""
  description: "A serially interfaced iterative CORDIC accelerator supporting vector rotation, magnitude and phase calculation, selectable iteration count, and optional shift-add gain compensation."
  language: "Verilog"
  clock_hz: 10000000

  tiles: "1x1"
  top_module: "tt_um_cordic_iter"

  source_files:
    - "project.v"
    - "dsp_fir_iir.v"

# Pinout
pinout:
  # Inputs
  ui[0]: "SDI"
  ui[1]: "SH_EN"
  ui[2]: "START"
  ui[3]: "MODE"
  ui[4]: "GAIN_COMP"
  ui[5]: "NSEL0"
  ui[6]: "NSEL1"
  ui[7]: "NSEL2"

  # Outputs
  uo[0]: "SDO"
  uo[1]: "BUSY"
  uo[2]: "DONE"
  uo[3]: "UNUSED"
  uo[4]: "ITER_COUNT0"
  uo[5]: "ITER_COUNT1"
  uo[6]: "ITER_COUNT2"
  uo[7]: "ITER_COUNT3"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
